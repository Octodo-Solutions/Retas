<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RWH concept design — Retas Enviro Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --paper:#EFF2F0; --sheet:#FBFCFB; --band:#E4E9E6;
  --ink:#14211D; --ink2:#4E5F59; --ink3:#7C8B85;
  --rule:#C3CCC7; --rule2:#DDE4E0;
  --water:#0C6B70; --water-soft:#DCEBEB;
  --sand:#A8762E; --sand-soft:#F2E8D6;
  --fail:#A6382C; --fail-soft:#F6E3E0;
  --pass:#2F6B45; --pass-soft:#E0EDE4;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:Archivo,system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--water);outline-offset:2px;border-radius:2px}

.masthead{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;padding:14px 26px;border-bottom:1px solid var(--rule);background:var(--sheet)}
.brand{font-weight:700;letter-spacing:-.01em;font-size:15px}
.brand span{color:var(--water)}
.masthead .job{color:var(--ink2);font-size:13.5px}
.masthead .job b{font-weight:600;color:var(--ink)}
.masthead .spacer{flex:1}
.revtag{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink3);border:1px solid var(--rule);border-radius:2px;padding:2px 7px}

.shell{display:flex;align-items:stretch;min-height:calc(100vh - 53px)}
.rail{width:228px;flex:none;padding:26px 0 40px;border-right:1px solid var(--rule);background:var(--sheet)}
.rail h2{font-size:11.5px;font-weight:600;color:var(--ink3);padding:0 20px 14px}
.scale{position:relative;padding-left:52px}
.scale::before{content:"";position:absolute;left:34px;top:8px;bottom:8px;width:1px;background:var(--rule)}
.lvl{position:relative;display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:9px 14px 9px 0;color:var(--ink2);font-size:13.5px}
.lvl::before{content:"";position:absolute;left:-22px;top:50%;width:13px;height:1px;background:var(--rule)}
.lvl::after{content:"";position:absolute;left:-21px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--sheet);border:1px solid var(--rule)}
.lvl .d{position:absolute;left:-52px;top:50%;transform:translateY(-50%);font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink3)}
.lvl:hover{color:var(--ink)}
.lvl.done{color:var(--ink)}
.lvl.done::after{background:var(--water);border-color:var(--water)}
.lvl.here{color:var(--ink);font-weight:600}
.lvl.here::after{background:var(--water);border-color:var(--water);box-shadow:0 0 0 3px var(--water-soft)}
.lvl[disabled]{cursor:not-allowed;color:var(--ink3)}

.stage{flex:1;min-width:0;padding:30px 34px 64px;max-width:1240px}
.stage-head{margin-bottom:22px;max-width:64ch}
.stage-head h1{font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.stage-head p{color:var(--ink2);margin-top:5px;font-size:14.5px}

.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:3px}
.panel + .panel{margin-top:16px}
.panel > h3{font-size:13px;font-weight:600;padding:11px 16px;border-bottom:1px solid var(--rule2)}
.panel > h3 .sub{font-weight:400;color:var(--ink3);margin-left:8px}
.panel .body{padding:16px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:12.5px;color:var(--ink2);font-weight:500}
.f .hint{font-size:11.5px;color:var(--ink3);line-height:1.35}
.f input,.f select{border:1px solid var(--rule);border-radius:2px;background:#fff;padding:7px 9px;font-size:14px;width:100%}
.f input[type=number]{font-family:"IBM Plex Mono",monospace;text-align:right}
.f input:focus,.f select:focus{border-color:var(--water)}
.unit{position:relative}
.unit input{padding-right:52px}
.unit .u{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11.5px;color:var(--ink3);font-family:"IBM Plex Mono",monospace;pointer-events:none}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;font-size:11.5px;color:var(--ink2);padding:8px 9px;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:bottom}
td{padding:6px 9px;border-bottom:1px solid var(--rule2);vertical-align:middle}
tr:last-child td{border-bottom:0}
.r{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
th.r{text-align:right}
tbody tr:hover td{background:var(--band)}
td input,td select{border:1px solid transparent;background:transparent;border-radius:2px;padding:4px 5px;width:100%;font-size:13.5px}
td input:hover,td select:hover{border-color:var(--rule)}
td input:focus,td select:focus{border-color:var(--water);background:#fff}
td input[type=number]{font-family:"IBM Plex Mono",monospace;text-align:right}
td.in{background:#FFFDF6}
tbody tr:hover td.in{background:#FBF6E8}
.sect td{background:var(--band);font-weight:600;font-size:12px;border-bottom:1px solid var(--rule)}
tfoot td{border-top:1px solid var(--rule);font-weight:600;background:var(--sheet);border-bottom:0}
.tblwrap{overflow-x:auto}
.wide{min-width:1150px}

.deriv{background:var(--band);border-left:2px solid var(--water);padding:10px 14px;margin-top:14px;border-radius:0 2px 2px 0}
.deriv .k{font-size:11.5px;color:var(--ink2);margin-bottom:3px}
.deriv .v{font-family:"IBM Plex Mono",monospace;font-size:13px;line-height:1.65;word-break:break-word}
.deriv .v em{font-style:normal;color:var(--water);font-weight:600}

.check{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-radius:2px;margin-bottom:8px;font-size:13.5px}
.check:last-child{margin-bottom:0}
.check .mark{flex:none;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;margin-top:1px}
.check .txt strong{display:block;font-weight:600;margin-bottom:2px}
.check .txt span{color:var(--ink2);font-size:12.5px}
.check.ok{background:var(--pass-soft)} .check.ok .mark{background:var(--pass)}
.check.no{background:var(--fail-soft)} .check.no .mark{background:var(--fail)}
.check.warn{background:var(--sand-soft)} .check.warn .mark{background:var(--sand)}

.drop{border:1px dashed var(--rule);border-radius:3px;background:#fff;padding:24px 18px;text-align:center}
.drop.has{border-style:solid;border-color:var(--water);background:var(--water-soft);text-align:left;display:flex;gap:12px;align-items:center}
.drop .ico{font-family:"IBM Plex Mono",monospace;font-size:11px;border:1px solid var(--water);color:var(--water);border-radius:2px;padding:2px 6px;flex:none}
.drop p{font-size:13.5px;color:var(--ink2)}
.drop b{color:var(--ink);font-weight:600}

.actions{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.actions .spacer{flex:1}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px 20px;border-radius:2px;font-size:14px;font-weight:500;cursor:pointer}
.btn:hover{background:#000}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{background:var(--band)}
.btn.small{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.note{font-size:12.5px;color:var(--ink3);max-width:52ch}
.tag{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:1px 6px;border-radius:2px;background:var(--band);color:var(--ink2)}
.tag.roof{background:var(--water-soft);color:var(--water)}
.tag.paved{background:var(--sand-soft);color:var(--sand)}
.tag.green{background:var(--pass-soft);color:var(--pass)}
.draw svg{display:block;width:100%;height:auto;max-width:300px;margin:0 auto}

/* ---------- CAD viewer ---------- */
.cad{display:grid;grid-template-columns:minmax(0,1fr) 262px;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:#fff}
.cadview{position:relative;background:var(--paper);height:430px;overflow:hidden}
.cadview canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.cadview canvas.drag{cursor:grabbing}
.cadtools{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
.cadtools button{border:1px solid var(--rule);background:rgba(251,252,251,.94);color:var(--ink2);
  border-radius:2px;padding:4px 9px;font-size:11.5px;cursor:pointer;font-family:"IBM Plex Mono",monospace}
.cadtools button:hover{color:var(--ink);border-color:var(--ink3)}
.cadstat{position:absolute;right:10px;bottom:10px;background:rgba(251,252,251,.94);border:1px solid var(--rule);
  border-radius:2px;padding:3px 8px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink2)}
.cadbusy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(239,242,240,.96);gap:10px}
.cadbusy .bar{width:200px;height:3px;background:var(--rule);border-radius:2px;overflow:hidden}
.cadbusy .bar i{display:block;height:100%;background:var(--water);width:0}
.cadbusy p{font-size:12.5px;color:var(--ink2);font-family:"IBM Plex Mono",monospace}
.cadlayers{border-left:1px solid var(--rule);background:var(--sheet);display:flex;flex-direction:column;max-height:430px}
.cadlayers h4{font-size:11.5px;font-weight:600;color:var(--ink2);padding:10px 12px;border-bottom:1px solid var(--rule2);flex:none}
.cadlayers .scrollers{overflow-y:auto;flex:1}
.lrow{display:grid;grid-template-columns:16px minmax(0,1fr);gap:7px;padding:6px 12px;border-bottom:1px solid var(--rule2);align-items:start}
.lrow:hover{background:var(--band)}
.lrow .eye{width:12px;height:12px;border-radius:2px;border:1px solid var(--rule);background:#fff;cursor:pointer;margin-top:3px;padding:0}
.lrow .eye[data-on="1"]{background:var(--ink2);border-color:var(--ink2)}
.lrow .nm{font-size:12px;line-height:1.3;word-break:break-word}
.lrow .meta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink3);margin-top:1px}
.lrow select{width:100%;margin-top:4px;font-size:11px;padding:2px 4px;border:1px solid var(--rule);border-radius:2px;background:#fff}
.lrow.tag-roof{background:var(--water-soft)}
.lrow.tag-paved{background:var(--sand-soft)}
.lrow.tag-green{background:var(--pass-soft)}
.cadfoot{border-top:1px solid var(--rule2);padding:10px 12px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink2);flex:none}
.cadfoot div{display:flex;justify-content:space-between;padding:1px 0}
@media (max-width:820px){.cad{grid-template-columns:minmax(0,1fr)}.cadlayers{border-left:0;border-top:1px solid var(--rule);max-height:260px}}

/* ---------- zone review ---------- */
.zonewrap{display:grid;grid-template-columns:minmax(0,1fr) 250px}
.zonemap{height:340px;background:var(--paper);border-right:1px solid var(--rule2)}
.zonemap canvas{display:block;width:100%;height:100%}
.zonekey{padding:12px;overflow-y:auto;max-height:340px}
.zk{display:grid;grid-template-columns:12px minmax(0,1fr);gap:9px;padding:7px 0;border-bottom:1px solid var(--rule2)}
.zk:last-child{border-bottom:0}
.zk{cursor:pointer;border-radius:2px;padding-left:5px;margin-left:-5px}
.zk:hover{background:var(--band)}
.zk.on{background:var(--band)}
.zk.off{opacity:.45}
.badge{font-family:"IBM Plex Mono",monospace;font-size:9.5px;background:var(--sand-soft);
  color:var(--sand);border-radius:2px;padding:1px 4px;vertical-align:1px}
.zk .sw{width:12px;height:12px;border-radius:2px;margin-top:3px}
.zk b{font-size:12.5px;font-weight:600}
.zk .meta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink3);line-height:1.45}
.promptbar{display:flex;gap:8px}
.promptbar input{flex:1;border:1px solid var(--rule);border-radius:2px;background:#fff;padding:9px 11px;font-size:14px}
.promptbar input:focus{border-color:var(--water)}
.plog{margin-top:14px;border-top:1px solid var(--rule2);padding-top:10px}
.pl{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:6px 0;border-bottom:1px solid var(--rule2)}
.pl:last-child{border-bottom:0}
.pl .q{font-size:12.5px;color:var(--ink2)}
.pl .q::before{content:"› ";color:var(--ink3)}
.pl .a{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--water)}
.pl.bad .a{color:var(--fail)}
@media (max-width:820px){.zonewrap{grid-template-columns:minmax(0,1fr)}
  .zonemap{border-right:0;border-bottom:1px solid var(--rule2)}.zonekey{max-height:none}}
.legend{font-size:11.5px;color:var(--ink3);padding:0 16px 14px}
.outlist{list-style:none}
.outlist li{display:flex;gap:11px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--rule2);font-size:13.5px}
.outlist li:last-child{border-bottom:0}
.outlist .ext{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3);border:1px solid var(--rule);border-radius:2px;padding:1px 5px;flex:none}
.outlist .sub{color:var(--ink3);font-size:12.5px}

@media (max-width:900px){.grid3,.grid4{grid-template-columns:1fr 1fr}}
@media (max-width:720px){
  .shell{flex-direction:column}
  .rail{width:100%;border-right:0;border-bottom:1px solid var(--rule);padding:18px 0 22px}
  .stage{padding:22px 18px 52px}
  .grid2,.grid3,.grid4{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="masthead">
  <div class="brand">Retas <span>Enviro</span></div>
  <div class="job">Concept design — <b id="mh-job">Mega Green City, Bareilly</b></div>
  <div class="spacer"></div>
  <div class="revtag">Rev B</div>
</header>

<div class="shell">
  <nav class="rail"><h2>Design sequence</h2><div class="scale" id="rail"></div></nav>
  <main class="stage" id="stage"></main>
</div>

<script>
/* ================= CONSTANTS from the module sheet ================= */
const PL = 0.683, PW = 0.41;                 // plate size, m
const DEPTHS = {3:1.31, 4:1.74, 5:2.17};     // triple / quad / penta
const STACK  = {3:"Triple", 4:"Quad", 5:"Penta"};
const PLATES = {1:[4,4], 2:[7,8], 3:[10,12], 4:[13,16], 5:[16,20]};
const COEF = {roof:0.9, paved:0.7, green:0.2};
const COVER = 0.57;                          // company standard cover constant

const S = {
  step:0, seen:0, approved:false, uploaded:true,
  project:{ name:"Mega Green City, Bareilly", client:"Mega Green Developers", city:"Bareilly" },
  rain:{ intensity:20, duration:1 },
  nTanks:3,
  zones:[
    {id:1, name:"RWH-1", roof:5755,  paved:15395, green:1035, layers:4, nl:39, nw:17, bores:3, bdepth:30, invert:1.0},
    {id:2, name:"RWH-2", roof:15958, paved:8424,  green:5112, layers:4, nl:46, nw:19, bores:3, bdepth:30, invert:1.0},
    {id:3, name:"RWH-3", roof:13083, paved:13569, green:4445, layers:3, nl:55, nw:22, bores:3, bdepth:30, invert:1.0}
  ],
  dc:{ L:3, W:2.5, D:3, wall:0.25, pcc:0.1, slab:0.15, baffle:0.2 },
  fc:{ L:2, W:1.5, D:2, wall:0.25, pcc:0.1 },
  region:"Agra, Kanpur, Bihar and Lucknow"
};

const STEPS = [
  {d:"0.0", t:"Project and drawing",  p:"Basic details, the client's landscape drawing, and how many tanks the scheme needs."},
  {d:"0.5", t:"Zones for review",     p:"Areas read off the drawing for each tank. Check them, correct anything wrong, then approve."},
  {d:"1.0", t:"Volume and sizing",    p:"Runoff volume per tank, then module counts solved to L, W and H."},
  {d:"1.5", t:"Tank calculations",    p:"Borewells and invert level are yours. Dimensions carry through and stay editable."},
  {d:"2.0", t:"Total calculation",    p:"Every tank on one line, in the column order the BOQ reads from."},
  {d:"2.5", t:"Chambers",             p:"Desilting and filter chamber quantities, and the civil works summary."},
  {d:"3.0", t:"Bill of quantities",   p:"Recharge tank with brick masonry desilting chamber."}
];

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const n = (v,d=0) => (isFinite(v)?Number(v):0).toLocaleString("en-IN",{minimumFractionDigits:d,maximumFractionDigits:d});
const inr = v => "₹"+Number(Math.round(v||0)).toLocaleString("en-IN");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rainM = () => S.rain.intensity * S.rain.duration / 1000;

/* ================= SIZING — Bareilly sheet ================= */
function potential(z){
  const r = z.roof*COEF.roof*rainM(), p = z.paved*COEF.paved*rainM(), g = z.green*COEF.green*rainM();
  return { r, p, g, total:r+p+g, area:z.roof+z.paved+z.green };
}
/* Solve module grid: minimise |V - Vreq| within a workable aspect */
function solveGrid(vReq, layers){
  const H = DEPTHS[layers]; let best=null;
  for(let nl=1; nl<=140; nl++){
    for(let nw=1; nw<=70; nw++){
      const L=nl*PL, W=nw*PW;
      const asp = L/W; if(asp<1.5||asp>5) continue;
      const v = L*W*H, d = Math.abs(v-vReq);
      if(!best || d<best.d) best={nl,nw,v,d};
    }
  }
  return best || {nl:1,nw:1,v:PL*PW*H,d:0};
}
function tankOf(z){
  const H = DEPTHS[z.layers], L = z.nl*PL, W = z.nw*PW;
  const boxes = z.nl*z.nw, [lg,sm] = PLATES[z.layers];
  return { ...z, H, L:+L.toFixed(3), W:+W.toFixed(3), V:L*W*H, boxes, large:boxes*lg, small:boxes*sm };
}

/* ================= PER-TANK TAKE-OFF — RWH-n sheet ================= */
function calc(z){
  const t = tankOf(z), {L,W,H} = t;
  const D = z.invert + 0.2 + COVER + H + 0.2;
  const aBot=(L+1)*(W+1), aTop=(L+2)*(W+2);
  const exc=((aTop*D)+(aBot*D))/2;
  const vol=L*W*H;
  const geo=(2*(L*W)+2*(W*H)+2*(H*L))*1.3;
  const geoBase=aBot*1.1;
  const agg=aBot*0.1, sand=aBot*0.1 + L*W*0.2;
  const back=exc-vol-sand-agg;
  const gravel=((3.14*0.15*0.15)-(3.14*0.075*0.075))*z.bdepth*35.314*z.bores;
  return { ...t, D, vol, geo, geoBase, agg, sand, back, exc,
    dress:aBot, boreTot:z.bores*z.bdepth, pipeTot:z.bores*z.bdepth,
    plain:z.bores*z.bdepth*0.4, slot:z.bores*z.bdepth*0.6,
    gravel, ports:Math.max(1,Math.ceil(D/1.5)),
    micro:Math.max(1,Math.ceil(L*W/60)), horiz:0 };
}
const allCalc = () => S.zones.map(calc);
const sum = k => allCalc().reduce((a,t)=>a+(t[k]||0),0);

/* ================= CHAMBERS — Desilting sheet ================= */
function chamber(c, withRcc){
  const oL=c.L+2*c.wall, oW=c.W+2*c.wall;
  const exc=(oL+1)*(oW+1)*(c.D+c.pcc+(withRcc?c.slab:0));
  const pcc=(oL+0.6)*(oW+0.6)*c.pcc;
  const brick=(oL*oW*c.D)-(c.L*c.W*c.D);
  const baffle=withRcc?(c.L*c.D*(c.baffle||0.2)):0;
  const plaster=((oL+oW)*c.D)*2+((c.L+c.W)*c.D)*2;
  const rcc=withRcc?oL*oW*c.slab:0;
  const shut=withRcc?(c.L*c.W)+((oL+oW)*2*c.slab):0;
  const bars10=withRcc?(((oL/0.15)+1)*oW)*0.617*2:0;
  const bars8 =withRcc?(((oW/0.15)+1)*oL)*0.398*2:0;
  return { exc, pcc, brick:brick+baffle, plaster, rcc, shut, steel:bars10+bars8 };
}
function summary(){
  const d=chamber(S.dc,true), f=chamber(S.fc,false);
  return [
    {n:"Excavation", d:d.exc,  f:f.exc,  u:"Cum"},
    {n:"PCC",        d:d.pcc,  f:f.pcc,  u:"Cum"},
    {n:"Brick work", d:d.brick,f:f.brick,u:"Cum"},
    {n:"Plaster",    d:d.plaster,f:f.plaster,u:"Sqm"},
    {n:"RCC",        d:d.rcc,  f:0,      u:"Cum"},

/* ================= DXF PARSER + VIEWER ================= */
const CAD={loaded:false,parsing:false,pct:0,name:"",size:0,layers:[],lidx:{},ents:[],
  bbox:null,upm:1000,texts:0,note:""};
const VIEW={sc:1,ox:0,oy:0,drag:false,px:0,py:0,mx:null,my:null};
let CV=null,CTX=null;

function parseDXF(text,done){
  CAD.parsing=true; CAD.pct=0;
  let i=0; const len=text.length;
  let sect=null,tbl=null,pend=null,ent=null,lay=null,closed=false;
  let xs=[],ys=[],cx=0,cy=0,rr=0,a0=0,a1=0;
  const layers=[],lidx={},ents=[];
  let bx0=1e30,by0=1e30,bx1=-1e30,by1=-1e30,texts=0;
  let hkey=null, ext={};

  const L=nm=>{ if(!(nm in lidx)){lidx[nm]=layers.length;layers.push({name:nm,n:0,cn:0,area:0,vis:true,tag:""});}
    return lidx[nm]; };
  function bump(x,y){ if(x<bx0)bx0=x; if(x>bx1)bx1=x; if(y<by0)by0=y; if(y>by1)by1=y; }

  function flush(){
    if(!ent){return;}
    const li=lay?L(lay):null;
    if(li!==null){
      if(ent==="LWPOLYLINE"||ent==="POLYLINE"){
        const m=Math.min(xs.length,ys.length);
        if(m>=2){
          const p=new Float64Array(m*2);
          for(let k=0;k<m;k++){p[k*2]=xs[k];p[k*2+1]=ys[k];bump(xs[k],ys[k]);}
          ents.push({l:li,t:closed?"P":"O",p});
          layers[li].n++;
          if(closed&&m>=3){
            let a=0;
            for(let k=0;k<m;k++){const j=(k+1)%m;a+=xs[k]*ys[j]-xs[j]*ys[k];}
            layers[li].area+=Math.abs(a)/2; layers[li].cn++;
          }
        }
      } else if(ent==="LINE"){
        if(xs.length>=2&&ys.length>=2){
          ents.push({l:li,t:"O",p:new Float64Array([xs[0],ys[0],xs[1],ys[1]])});
          bump(xs[0],ys[0]); bump(xs[1],ys[1]); layers[li].n++;
        }
      } else if(ent==="CIRCLE"){
        if(rr>0){ents.push({l:li,t:"C",c:[cx,cy,rr]});bump(cx-rr,cy-rr);bump(cx+rr,cy+rr);
          layers[li].n++;layers[li].area+=Math.PI*rr*rr;layers[li].cn++;}
      } else if(ent==="ARC"){
        if(rr>0){ents.push({l:li,t:"A",c:[cx,cy,rr,a0,a1]});bump(cx-rr,cy-rr);bump(cx+rr,cy+rr);layers[li].n++;}
      } else if(ent==="TEXT"||ent==="MTEXT"){ texts++; }
    }
    ent=null;lay=null;closed=false;xs=[];ys=[];cx=cy=rr=0;a0=0;a1=360;
  }

  function nextLine(){
    if(i>=len)return null;
    let j=text.indexOf("\n",i);
    if(j<0)j=len;
    let s=text.substring(i,j); i=j+1;
    if(s.charCodeAt(s.length-1)===13)s=s.slice(0,-1);
    return s;
  }

  function step(){
    const stop=performance.now()+28;
    while(performance.now()<stop){
      for(let b=0;b<9000;b++){
        const c=nextLine(); if(c===null){finish();return;}
        const v=nextLine(); if(v===null){finish();return;}
        const code=c.trim();
        if(sect==="HEADER"){
          if(code==="9")hkey=v.trim();
          else if(hkey==="$EXTMIN"||hkey==="$EXTMAX"){
            if(code==="10"||code==="20"){const f=parseFloat(v);
              if(f===f)ext[hkey+code]=f;}
          }
        }
        if(code==="0"){
          flush();
          const val=v.trim();
          if(val==="SECTION")sect="?";
          else if(val==="ENDSEC"){sect=null;tbl=null;}
          else if(val==="TABLE")pend="T";
          else if(val==="ENDTAB")tbl=null;
          else if(sect==="TABLES"&&val==="LAYER"&&tbl==="LAYER")pend="L";
          else if(sect==="ENTITIES")ent=val;
        } else if(code==="2"){
          const val=v.trim();
          if(sect==="?")sect=val;
          else if(pend==="T"){tbl=val;pend=null;}
          else if(pend==="L"){L(val);pend=null;}
        } else if(sect==="ENTITIES"&&ent){
          if(code==="8")lay=v.trim();
          else if(code==="70"&&(ent==="LWPOLYLINE"||ent==="POLYLINE")){closed=!!(parseInt(v,10)&1);}
          else if(code==="10"){const f=parseFloat(v);if(f===f){if(ent==="CIRCLE"||ent==="ARC")cx=f;else xs.push(f);}}
          else if(code==="20"){const f=parseFloat(v);if(f===f){if(ent==="CIRCLE"||ent==="ARC")cy=f;else ys.push(f);}}
          else if(code==="11"&&ent==="LINE"){const f=parseFloat(v);if(f===f)xs.push(f);}
          else if(code==="21"&&ent==="LINE"){const f=parseFloat(v);if(f===f)ys.push(f);}
          else if(code==="40"&&(ent==="CIRCLE"||ent==="ARC")){const f=parseFloat(v);if(f===f)rr=f;}
          else if(code==="50"&&ent==="ARC"){const f=parseFloat(v);if(f===f)a0=f;}
          else if(code==="51"&&ent==="ARC"){const f=parseFloat(v);if(f===f)a1=f;}
        }
      }
    }
    CAD.pct=i/len; paintBusy();
    requestAnimationFrame(step);
  }

  function finish(){
    flush();
    CAD.layers=layers; CAD.lidx=lidx; CAD.ents=ents; CAD.texts=texts;
    let bb=(bx1>bx0)?[bx0,by0,bx1,by1]:null;
    const hx0=ext["$EXTMIN10"],hy0=ext["$EXTMIN20"],hx1=ext["$EXTMAX10"],hy1=ext["$EXTMAX20"];
    if(hx1>hx0&&hy1>hy0){
      // header extents beat computed ones: stray off-sheet entities skew the latter
      if(!bb||((hx1-hx0)*(hy1-hy0) < (bb[2]-bb[0])*(bb[3]-bb[1]))) bb=[hx0,hy0,hx1,hy1];
    }
    CAD.bbox=bb;
    const w=CAD.bbox?(CAD.bbox[2]-CAD.bbox[0]):0;
    CAD.upm=w>20000?1000:1;
    CAD.note=w>20000?"units read as millimetres":"units read as metres";
    CAD.parsing=false; CAD.loaded=true;
    autoTag(); done&&done();
  }
  step();
}

/* guess surface type from layer name */
function autoTag(){
  const R=/roof|terrace|slab|plot|villa|building|blk|block|tower|hut|podium/i;
  const P=/road|pav|drive|park|paths|kerb|curb|court|plaza|hard/i;
  const G=/green|lawn|land ?scape|garden|soft|tree|park$/i;
  CAD.layers.forEach(l=>{
    if(l.cn===0){l.tag="";return;}
    if(/title|frame|border|defpoint|grid|viewport/i.test(l.name)){l.tag="";return;}
    if(G.test(l.name))l.tag="green";
    else if(P.test(l.name))l.tag="paved";
    else if(R.test(l.name))l.tag="roof";
    else l.tag="";
  });
}
const layerArea=tag=>CAD.layers.filter(l=>l.tag===tag)
  .reduce((a,l)=>a+l.area,0)/(CAD.upm*CAD.upm);

/* ---------- canvas ---------- */
function cvSize(){
  if(!CV)return[0,0];
  const dpr=window.devicePixelRatio||1, r=CV.getBoundingClientRect();
  if(CV.width!==Math.round(r.width*dpr)||CV.height!==Math.round(r.height*dpr)){
    CV.width=Math.round(r.width*dpr); CV.height=Math.round(r.height*dpr);
  }
  return[r.width,r.height];
}
function zoomExtents(){
  const[w,h]=cvSize(); if(!CAD.bbox||!w)return;
  const[x0,y0,x1,y1]=CAD.bbox;
  const s=Math.min(w/Math.max(x1-x0,1e-6),h/Math.max(y1-y0,1e-6))*0.88;
  VIEW.sc=s; VIEW.ox=(x0+x1)/2-w/(2*s); VIEW.oy=(y0+y1)/2-h/(2*s);
  drawCAD();
}
function zoomTag(tag){
  const ls=CAD.layers.map((l,i)=>[l,i]).filter(([l])=>l.tag===tag).map(([,i])=>i);
  if(!ls.length)return;
  let x0=1e30,y0=1e30,x1=-1e30,y1=-1e30;
  for(const e of CAD.ents){ if(!ls.includes(e.l))continue;
    if(e.p){for(let k=0;k<e.p.length;k+=2){x0=Math.min(x0,e.p[k]);x1=Math.max(x1,e.p[k]);
      y0=Math.min(y0,e.p[k+1]);y1=Math.max(y1,e.p[k+1]);}}
    else if(e.c){x0=Math.min(x0,e.c[0]-e.c[2]);x1=Math.max(x1,e.c[0]+e.c[2]);
      y0=Math.min(y0,e.c[1]-e.c[2]);y1=Math.max(y1,e.c[1]+e.c[2]);}}
  if(x1<=x0)return;
  const[w,h]=cvSize();
  const s=Math.min(w/(x1-x0),h/(y1-y0))*0.8;
  VIEW.sc=s; VIEW.ox=(x0+x1)/2-w/(2*s); VIEW.oy=(y0+y1)/2-h/(2*s);
  drawCAD();
}
const STYLE={roof:["#0C6B70",1.1],paved:["#A8762E",1.1],green:["#2F6B45",1.1],"":["#98A6A0",.7]};
function drawCAD(){
  if(!CV)return;
  const[w,h]=cvSize(); if(!w)return;
  const dpr=window.devicePixelRatio||1;
  CTX.setTransform(dpr,0,0,dpr,0,0);
  CTX.clearRect(0,0,w,h);
  CTX.fillStyle="#EFF2F0"; CTX.fillRect(0,0,w,h);
  if(!CAD.loaded)return;
  const sc=VIEW.sc,ox=VIEW.ox,oy=VIEW.oy;
  const SX=x=>(x-ox)*sc, SY=y=>h-(y-oy)*sc;
  for(const tag of ["","green","paved","roof"]){
    const[col,lw]=STYLE[tag];
    CTX.strokeStyle=col; CTX.lineWidth=lw; CTX.globalAlpha=tag?0.95:0.5;
    CTX.beginPath();
    for(const e of CAD.ents){
      const L=CAD.layers[e.l];
      if(!L||!L.vis||(L.tag||"")!==tag)continue;
      if(e.p){
        const p=e.p,n=p.length;
        CTX.moveTo(SX(p[0]),SY(p[1]));
        for(let k=2;k<n;k+=2)CTX.lineTo(SX(p[k]),SY(p[k+1]));
        if(e.t==="P")CTX.closePath();
      } else if(e.t==="C"){
        const r=e.c[2]*sc; if(r<0.4)continue;
        CTX.moveTo(SX(e.c[0])+r,SY(e.c[1]));
        CTX.arc(SX(e.c[0]),SY(e.c[1]),r,0,Math.PI*2);
      } else if(e.t==="A"){
        const r=e.c[2]*sc; if(r<0.4)continue;
        CTX.arc(SX(e.c[0]),SY(e.c[1]),r,-e.c[4]*Math.PI/180,-e.c[3]*Math.PI/180);
      }
    }
    CTX.stroke();
  }
  CTX.globalAlpha=1;
  const st=document.getElementById("cadstat");
  if(st){
    const m=CAD.upm;
    st.textContent=(VIEW.mx===null?"":`x ${(VIEW.mx/m).toFixed(1)}  y ${(VIEW.my/m).toFixed(1)} m   `)
      +`1:${Math.round(m/VIEW.sc/1)}`;
  }
}
function paintBusy(){
  const b=document.getElementById("cadbar");
  if(b)b.style.width=Math.round(CAD.pct*100)+"%";
}
function bindCAD(){
  CV=document.getElementById("cadcv"); if(!CV)return;
  CTX=CV.getContext("2d");
  CV.onwheel=e=>{e.preventDefault();
    const r=CV.getBoundingClientRect(),h=r.height;
    const sx=e.clientX-r.left, sy=e.clientY-r.top;
    const wx=sx/VIEW.sc+VIEW.ox, wy=(h-sy)/VIEW.sc+VIEW.oy;
    VIEW.sc*=e.deltaY<0?1.18:1/1.18;
    VIEW.ox=wx-sx/VIEW.sc; VIEW.oy=wy-(h-sy)/VIEW.sc; drawCAD();};
  CV.onpointerdown=e=>{VIEW.drag=true;VIEW.px=e.clientX;VIEW.py=e.clientY;
    CV.classList.add("drag");CV.setPointerCapture(e.pointerId);};
  CV.onpointermove=e=>{
    const r=CV.getBoundingClientRect();
    VIEW.mx=(e.clientX-r.left)/VIEW.sc+VIEW.ox;
    VIEW.my=(r.height-(e.clientY-r.top))/VIEW.sc+VIEW.oy;
    if(VIEW.drag){VIEW.ox-=(e.clientX-VIEW.px)/VIEW.sc;VIEW.oy+=(e.clientY-VIEW.py)/VIEW.sc;
      VIEW.px=e.clientX;VIEW.py=e.clientY;}
    drawCAD();};
  CV.onpointerup=CV.onpointercancel=()=>{VIEW.drag=false;CV.classList.remove("drag");};
  if(CAD.loaded&&!VIEW.sc)zoomExtents(); else drawCAD();
}
function onFile(ev){
  const f=(ev.target.files||ev.dataTransfer.files)[0]; if(!f)return;
  CAD.name=f.name; CAD.size=f.size; CAD.loaded=false; CAD.parsing=true; CAD.pct=0;
  S.uploaded=true; S.approved=false; render();
  const rd=new FileReader();
  rd.onload=()=>parseDXF(rd.result,()=>{render();setTimeout(()=>{zoomExtents();},30);});
  rd.readAsText(f);
}
function tagLayer(i,v){CAD.layers[i].tag=v;render();}
function eyeLayer(i){CAD.layers[i].vis=!CAD.layers[i].vis;render();}
function clearCAD(){CAD.loaded=false;CAD.parsing=false;CAD.ents=[];CAD.layers=[];
  CAD.bbox=null;S.uploaded=false;VIEW.sc=0;render();}

/* ================= ZONE EXTRACTION ================= */
const ZC=["#0C6B70","#A8762E","#2F6B45","#4A5E8C","#8C4A52","#6B6B2F","#6B4A7A","#8C5A2E",
          "#2E6B8C","#7A5A2E","#3E7A5E","#7A3E5E"];
S.log=[]; S.prov=[]; S.sel=null;

/* centroid + area of every closed polygon on a tagged layer */
function catchPolys(){
  const out=[], u2=CAD.upm*CAD.upm;
  for(const e of CAD.ents){
    const L=CAD.layers[e.l];
    if(!L||!L.vis||!L.tag||e.t!=="P"||!e.p)continue;
    const p=e.p,m=p.length/2; if(m<3)continue;
    let a=0,cx=0,cy=0;
    for(let k=0;k<m;k++){
      const j=(k+1)%m, x1=p[k*2],y1=p[k*2+1],x2=p[j*2],y2=p[j*2+1];
      const cr=x1*y2-x2*y1; a+=cr; cx+=(x1+x2)*cr; cy+=(y1+y2)*cr;
    }
    a/=2; if(Math.abs(a)<1e-6)continue;
    out.push({x:cx/(6*a),y:cy/(6*a),area:Math.abs(a)/u2,tag:L.tag,lay:L.name,e});
  }
  return out;
}

/* k-means++ on centroids, weighted by area. Seeded for reproducibility. */
function kmeans(pts,k){
  if(pts.length===0||k<1)return[];
  if(pts.length<=k)return pts.map((_,i)=>i);
  let seed=20260925;
  const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  const C=[{x:pts[0].x,y:pts[0].y}];
  while(C.length<k){
    const d=pts.map(p=>Math.min(...C.map(c=>(p.x-c.x)**2+(p.y-c.y)**2))*p.area);
    const tot=d.reduce((a,b)=>a+b,0); let r=rnd()*tot,i=0;
    while(i<d.length-1&&r>d[i]){r-=d[i];i++;}
    C.push({x:pts[i].x,y:pts[i].y});
  }
  let asg=new Array(pts.length).fill(0);
  for(let it=0;it<60;it++){
    let moved=false;
    pts.forEach((p,i)=>{
      let bi=0,bd=Infinity;
      C.forEach((c,j)=>{const d=(p.x-c.x)**2+(p.y-c.y)**2; if(d<bd){bd=d;bi=j;}});
      if(asg[i]!==bi){asg[i]=bi;moved=true;}
    });
    C.forEach((c,j)=>{
      let sx=0,sy=0,sw=0;
      pts.forEach((p,i)=>{if(asg[i]===j){sx+=p.x*p.area;sy+=p.y*p.area;sw+=p.area;}});
      if(sw>0){c.x=sx/sw;c.y=sy/sw;}
    });
    if(!moved)break;
  }
  return asg;
}

/* areas derive from polygon membership unless the zone was edited by number */
function syncZone(i){
  const p=S.prov[i],z=S.zones[i]; if(!p||!z)return;
  if(!z.edited){
    const A=t=>Math.round(p.pts.filter(m=>m.tag===t).reduce((a,m)=>a+m.area,0));
    z.roof=A("roof"); z.paved=A("paved"); z.green=A("green");
  }
  const w=p.pts.reduce((a,m)=>a+m.area,0)||1e-9;
  p.n=p.pts.length;
  p.cx=p.pts.reduce((a,m)=>a+m.x*m.area,0)/w;
  p.cy=p.pts.reduce((a,m)=>a+m.y*m.area,0)/w;
  p.byLay={}; p.pts.forEach(m=>{p.byLay[m.lay]=(p.byLay[m.lay]||0)+m.area;});
  const g=solveGrid(potential(z).total,z.layers); z.nl=g.nl; z.nw=g.nw;
}
function syncAll(){ S.zones.forEach((_,i)=>syncZone(i)); }

/* cluster the drawing into S.nTanks zones, recording provenance */
function buildZones(){
  const pts=catchPolys(); S.sel=null;
  if(!pts.length){ reseedFlat(); return; }
  const k=Math.max(1,Math.min(S.nTanks,pts.length));
  const asg=kmeans(pts,k);
  const cen=g=>{const w=g.reduce((a,m)=>a+m.area,0)||1e-9;
    return g.reduce((a,m)=>a+m.x*m.area,0)/w;};
  const groups=Array.from({length:k},(_,j)=>pts.filter((_,i)=>asg[i]===j))
    .filter(g=>g.length).sort((a,b)=>cen(a)-cen(b));
  S.zones=groups.map((g,i)=>({id:i+1,name:`RWH-${i+1}`,roof:0,paved:0,green:0,
    layers:4,nl:0,nw:0,bores:3,bdepth:30,invert:1.0,edited:false}));
  S.prov=groups.map(g=>({pts:g,n:g.length,cx:0,cy:0,byLay:{}}));
  syncAll();
}
function reseedFlat(){
  const v=S.nTanks, R=layerArea("roof")/v, Pv=layerArea("paved")/v, G=layerArea("green")/v;
  S.zones=Array.from({length:v},(_,i)=>({id:i+1,name:`RWH-${i+1}`,roof:Math.round(R),
    paved:Math.round(Pv),green:Math.round(G),layers:4,nl:0,nw:0,bores:3,bdepth:30,invert:1.0}));
  S.prov=[];
  S.zones.forEach(z=>{const g=solveGrid(potential(z).total,z.layers);z.nl=g.nl;z.nw=g.nw;});
}
function narrate(){
  if(!S.prov.length)return "";
  const tot=S.prov.reduce((a,p)=>a+p.n,0);
  const dom=S.zones.map((z,i)=>{
    const L=Object.entries(S.prov[i].byLay).sort((a,b)=>b[1]-a[1])[0];
    return L?L[0].trim():"—";});
  const dup=[];
  for(let i=0;i<S.zones.length;i++)for(let j=i+1;j<S.zones.length;j++){
    const a=S.zones[i],b=S.zones[j];
    if(S.prov[i].n===S.prov[j].n&&Math.abs(a.roof-b.roof)<=2&&Math.abs(a.green-b.green)<=2
      &&Math.abs(a.paved-b.paved)<=2&&a.roof+a.green>0) dup.push(`${a.name} and ${b.name}`);
  }
  return `Grouped ${n(tot)} closed boundaries into ${S.zones.length} zone${S.zones.length>1?"s":""} `
    +`by proximity, weighting each polygon by its area so large surfaces anchor the clusters. `
    +`${S.zones.map((z,i)=>`${z.name} centres on ${dom[i]} with ${n(S.prov[i].n)} boundaries`).join("; ")}. `
    +(dup.length?`${dup.join(", ")} came out with identical areas and boundary counts, which usually means `
      +`the drawing holds two copies of the same layout — ask for it to be halved if so. `:"")
    +`Drainage direction is not in the drawing, so the split is geometric — correct it below if the storm slopes say otherwise.`;
}

/* ================= PROMPT INTERPRETER ================= */
function zref(s){
  if(!s)return -1;
  s=String(s).trim().toLowerCase();
  const m=s.match(/(\d+)/);
  if(m){const i=+m[1]-1; return (i>=0&&i<S.zones.length)?i:-1;}
  const w={first:0,second:1,third:2,fourth:3,last:S.zones.length-1};
  return (s in w)?w[s]:-1;
}
function renumber(){S.zones.forEach((z,i)=>{z.id=i+1;
  if(!z.name||!z.name.trim()||/^RWH-\d+$/.test(z.name))z.name=`RWH-${i+1}`;});}
function resolve(){S.zones.forEach(z=>{const g=solveGrid(potential(z).total,z.layers);z.nl=g.nl;z.nw=g.nw;});}

function applyPrompt(txt){
  const t=(txt||"").trim(); if(!t)return null;
  const s=t.toLowerCase();
  let m,msg=null;

  const SP=S.prov.length>0;
  if((m=s.match(/merge\s+(?:zone\s*|rwh-?\s*)?(\w+)\s*(?:and|with|\+|,|into)\s*(?:zone\s*|rwh-?\s*)?(\w+)/))){
    const a=zref(m[1]),b=zref(m[2]);
    if(a<0||b<0||a===b)return{ok:false,msg:"Couldn't identify both zones."};
    const lo=Math.min(a,b),hi=Math.max(a,b),A=S.zones[lo],B=S.zones[hi];
    A.roof+=B.roof;A.paved+=B.paved;A.green+=B.green;A.edited=A.edited||B.edited;
    if(SP){S.prov[lo].pts=S.prov[lo].pts.concat(S.prov[hi].pts);S.prov.splice(hi,1);}
    S.zones.splice(hi,1);
    S.nTanks=S.zones.length;renumber();S.sel=lo;SP?syncAll():resolve();
    msg=`Merged into ${A.name} — ${SP?n(S.prov[lo].n)+" boundaries, ":""}${S.zones.length} zones now.`;
  }
  else if((m=s.match(/(?:split|divide)\s+(?:zone\s*|rwh-?\s*)?(\w+)(?:\s+into\s+(\d+))?/))){
    const a=zref(m[1]); if(a<0)return{ok:false,msg:"Couldn't identify that zone."};
    const parts=Math.max(2,Math.min(4,+(m[2]||2)));
    if(SP&&S.prov[a].pts.length>=parts){
      const sub=S.prov[a].pts, asg=kmeans(sub,parts);
      const cen=g=>{const w=g.reduce((x,y)=>x+y.area,0)||1e-9;
        return g.reduce((x,y)=>x+y.x*y.area,0)/w;};
      const gs=Array.from({length:parts},(_,j)=>sub.filter((_,i)=>asg[i]===j))
        .filter(g=>g.length).sort((x,y)=>cen(x)-cen(y));
      const base=S.zones[a];
      S.zones.splice(a,1,...gs.map(()=>({...base,id:0,name:"",roof:0,paved:0,green:0,nl:0,nw:0,edited:false})));
      S.prov.splice(a,1,...gs.map(g=>({pts:g,n:g.length,cx:0,cy:0,byLay:{}})));
      S.nTanks=S.zones.length;renumber();S.sel=a;syncAll();
      msg=`Split into ${gs.length} by proximity — ${gs.map(g=>g.length).join(" / ")} boundaries.`;
    } else {
      const A=S.zones[a];
      S.zones.splice(a,1,...Array.from({length:parts},()=>({...A,id:0,name:"",
        roof:Math.round(A.roof/parts),paved:Math.round(A.paved/parts),
        green:Math.round(A.green/parts),nl:0,nw:0,edited:true})));
      S.nTanks=S.zones.length;renumber();resolve();
      msg=`Split into ${parts} by area. Now ${S.zones.length} zones.`;
    }
  }
  else if((m=s.match(/(?:move|shift|give|assign|put)\s+(?:the\s+)?(roof\w*|paved?|green|landscape)\s*(?:area)?\s*(?:from\s*(?:zone\s*|rwh-?\s*)?(\w+))?\s*(?:to|into)\s*(?:zone\s*|rwh-?\s*)?(\w+)/))){
    const f=/roof/.test(m[1])?"roof":/pav/.test(m[1])?"paved":"green";
    const to=zref(m[3]); if(to<0)return{ok:false,msg:"Couldn't identify the target zone."};
    const from=m[2]?zref(m[2]):-1;
    if(SP){
      let moved=0;
      S.prov.forEach((p,i)=>{
        if(i===to||(from>=0&&i!==from))return;
        const keep=[],mv=[];
        p.pts.forEach(x=>(x.tag===f?mv:keep).push(x));
        p.pts=keep; S.prov[to].pts=S.prov[to].pts.concat(mv); moved+=mv.length;
      });
      S.zones.forEach(z=>z.edited=false); S.sel=to; syncAll();
      msg=moved?`${n(moved)} ${f} boundaries moved into ${S.zones[to].name}.`
               :`No ${f} boundaries found to move.`;
    } else {
      if(from>=0){S.zones[to][f]+=S.zones[from][f];S.zones[from][f]=0;}
      else{let acc=0;S.zones.forEach((z,i)=>{if(i!==to){acc+=z[f];z[f]=0;}});S.zones[to][f]+=acc;}
      S.zones[to].edited=true; resolve();
      msg=`All ${f} area consolidated into ${S.zones[to].name}.`;
    }
  }
  else if(/rebalance|equal|even(ly)?|same size/.test(s)){
    const R=S.zones.reduce((a,z)=>a+z.roof,0),P=S.zones.reduce((a,z)=>a+z.paved,0),
          G=S.zones.reduce((a,z)=>a+z.green,0),k=S.zones.length;
    S.zones.forEach(z=>{z.roof=Math.round(R/k);z.paved=Math.round(P/k);
      z.green=Math.round(G/k);z.edited=true;});
    resolve(); msg=`Areas spread evenly across ${k} zones — set by number, so the map still shows the source boundaries.`;
  }
  else if(/halve|half|duplicat|double.?count|mirror/.test(s)){
    S.zones.forEach(z=>{z.roof=Math.round(z.roof/2);z.paved=Math.round(z.paved/2);
      z.green=Math.round(z.green/2);z.edited=true;});
    resolve(); msg="All areas halved — use when the drawing holds two copies of the layout.";
  }
  else if((m=t.match(/rename\s+(?:zone\s*|rwh-?\s*)?(\w+)\s+(?:to|as)\s+(.+)$/i))){
    const a=zref(m[1]); if(a<0)return{ok:false,msg:"Couldn't identify that zone."};
    S.zones[a].name=m[2].trim().replace(/["']/g,"");
    msg=`Renamed to ${S.zones[a].name}.`;
  }
  else if((m=s.match(/(?:set|make)\s+(?:zone\s*|rwh-?\s*)?(\w+)\s+(roof\w*|paved?|green)\s*(?:area)?\s*(?:to|=)\s*([\d,\.]+)/))){
    const a=zref(m[1]); if(a<0)return{ok:false,msg:"Couldn't identify that zone."};
    const f=/roof/.test(m[2])?"roof":/pav/.test(m[2])?"paved":"green";
    S.zones[a][f]=Math.round(parseFloat(m[3].replace(/,/g,"")))||0;
    S.zones[a].edited=true; S.sel=a; resolve();
    msg=`${S.zones[a].name} ${f} set to ${n(S.zones[a][f])} sqm by hand.`;
  }
  else if((m=s.match(/(?:delete|remove|drop)\s+(?:zone\s*|rwh-?\s*)?(\w+)/))){
    const a=zref(m[1]); if(a<0)return{ok:false,msg:"Couldn't identify that zone."};
    if(S.zones.length<2)return{ok:false,msg:"At least one zone is needed."};
    const nm=S.zones[a].name;
    const orphan=SP?S.prov[a].pts:[];
    S.zones.splice(a,1); if(SP)S.prov.splice(a,1);
    orphan.forEach(x=>{
      let bi=0,bd=Infinity;
      S.prov.forEach((p,i)=>{const d=(x.x-p.cx)**2+(x.y-p.cy)**2; if(d<bd){bd=d;bi=i;}});
      if(S.prov[bi])S.prov[bi].pts.push(x);
    });
    S.nTanks=S.zones.length;S.sel=null;renumber();SP?syncAll():resolve();
    msg=`${nm} removed${orphan.length?`, its ${n(orphan.length)} boundaries reassigned to the nearest zones`:""}. Now ${S.zones.length} zones.`;
  }
  else if(/re-?(extract|cluster|run)|start over|reset/.test(s)){
    buildZones(); msg=`Re-clustered into ${S.zones.length} zones.`;
  }
  else return {ok:false,msg:null};
  S.approved=false;
  return {ok:true,msg};
}
function runPrompt(){
  const el=document.getElementById("zprompt"); if(!el)return;
  const t=el.value; const r=applyPrompt(t);
  if(!r){return;}
  if(r.ok) S.log.unshift({t, m:r.msg, ok:true});
  else S.log.unshift({t, m:r.msg||"Not understood. Try merge, split, move, rebalance, halve, rename, set or delete.", ok:false});
  el.value=""; render();
}

/* ================= ZONE MAP ================= */
let ZV=null,ZX=null;
function drawZones(){
  ZV=document.getElementById("zonecv"); if(!ZV||!CAD.loaded)return;
  ZX=ZV.getContext("2d");
  const dpr=window.devicePixelRatio||1, r=ZV.getBoundingClientRect();
  if(!r.width)return;
  ZV.width=Math.round(r.width*dpr); ZV.height=Math.round(r.height*dpr);
  ZX.setTransform(dpr,0,0,dpr,0,0);
  ZX.fillStyle="#EFF2F0"; ZX.fillRect(0,0,r.width,r.height);
  const b=CAD.bbox; if(!b)return;
  const sc=Math.min(r.width/(b[2]-b[0]),r.height/(b[3]-b[1]))*0.92;
  const ox=(b[0]+b[2])/2-r.width/(2*sc), oy=(b[1]+b[3])/2-r.height/(2*sc);
  const SX=x=>(x-ox)*sc, SY=y=>r.height-(y-oy)*sc;

  ZX.strokeStyle="#C3CCC7"; ZX.lineWidth=.5; ZX.globalAlpha=.55; ZX.beginPath();
  for(const e of CAD.ents){const L=CAD.layers[e.l];
    if(!L||!L.vis||L.tag||!e.p)continue;
    ZX.moveTo(SX(e.p[0]),SY(e.p[1]));
    for(let k=2;k<e.p.length;k+=2)ZX.lineTo(SX(e.p[k]),SY(e.p[k+1]));}
  ZX.stroke(); ZX.globalAlpha=1;

  const marks=[];
  S.prov.forEach((p,i)=>{
    const col=ZC[i%ZC.length], dim=(S.sel!==null&&S.sel!==i);
    ZX.globalAlpha=dim?0.22:1;
    ZX.fillStyle=col+(dim?"18":"38"); ZX.strokeStyle=col; ZX.lineWidth=dim?.6:1.1;
    p.pts.forEach(m=>{const e=m.e; if(!e.p)return;
      ZX.beginPath(); ZX.moveTo(SX(e.p[0]),SY(e.p[1]));
      for(let k=2;k<e.p.length;k+=2)ZX.lineTo(SX(e.p[k]),SY(e.p[k+1]));
      ZX.closePath(); ZX.fill(); ZX.stroke();});
    marks.push({i,col,x:SX(p.cx),y:SY(p.cy),dim});
  });
  ZX.globalAlpha=1;
  marks.forEach(mk=>{
    ZX.globalAlpha=mk.dim?0.35:1;
    ZX.fillStyle="#FBFCFB"; ZX.beginPath(); ZX.arc(mk.x,mk.y,15,0,Math.PI*2); ZX.fill();
    ZX.fillStyle=mk.col; ZX.beginPath(); ZX.arc(mk.x,mk.y,13,0,Math.PI*2); ZX.fill();
    if(S.zones[mk.i]&&S.zones[mk.i].edited){
      ZX.strokeStyle="#FBFCFB"; ZX.lineWidth=1.6; ZX.setLineDash([3,2.5]);
      ZX.beginPath(); ZX.arc(mk.x,mk.y,17.5,0,Math.PI*2); ZX.stroke(); ZX.setLineDash([]);
    }
    ZX.fillStyle="#fff"; ZX.font="600 12px 'IBM Plex Mono',monospace";
    ZX.textAlign="center"; ZX.textBaseline="middle";
    ZX.fillText(String(mk.i+1),mk.x,mk.y);
  });
  ZX.globalAlpha=1;
  ZV.onclick=ev=>{
    const rr=ZV.getBoundingClientRect(), px=ev.clientX-rr.left, py=ev.clientY-rr.top;
    let hit=null,bd=26*26;
    marks.forEach(mk=>{const d=(px-mk.x)**2+(py-mk.y)**2; if(d<bd){bd=d;hit=mk.i;}});
    S.sel=(hit===S.sel)?null:hit; render();
  };
  ZV.style.cursor="pointer";
}

        ondragover="event.preventDefault();this.classList.add('has')"
        ondragleave="this.classList.remove('has')"
        ondrop="event.preventDefault();onFile(event)">

      </div>

        ${CAD.parsing?`<div class="cadbusy"><p>Reading drawing…</p><div class="bar"><i id="cadbar"></i></div></div>`:`

        <div class="scrollers">
          ${CAD.layers.filter(l=>l.n>0).sort((a,b)=>b.area-a.area).map(l=>{
            const i=CAD.lidx[l.name];
            return `<div class="lrow ${l.tag?"tag-"+l.tag:""}">
              <button class="eye" data-on="${l.vis?1:0}" onclick="eyeLayer(${i})"
                aria-label="Toggle ${esc(l.name)}"></button>
              <div><div class="nm">${esc(l.name.trim()||"(unnamed)")}</div>
                <div class="meta">${l.n} ent · ${l.cn} closed${l.cn?` · ${n(l.area/(CAD.upm*CAD.upm))} sqm`:""}</div>
                ${l.cn?`<select onchange="tagLayer(${i},this.value)">
                  <option value="" ${!l.tag?"selected":""}>— not catchment —</option>
                  <option value="roof" ${l.tag==="roof"?"selected":""}>Rooftop</option>
                  <option value="paved" ${l.tag==="paved"?"selected":""}>Paved</option>
                  <option value="green" ${l.tag==="green"?"selected":""}>Green</option>

          <div><span>Paved</span><span>${n(layerArea("paved"))} sqm</span></div>
          <div><span>Green</span><span>${n(layerArea("green"))} sqm</span></div>

    <div class="body" ${(!CAD.loaded&&!CAD.parsing)?'style="padding-top:0"':""}>
      <div class="grid3">
        <div class="f"><label for="nt">RWH tanks required</label>
          <input id="nt" type="number" min="1" max="12" value="${S.nTanks}" oninput="setTanks(+this.value)">
          <div class="hint">The catchment is split into this many zones, one per tank.</div></div>
      </div>
      ${CAD.loaded&&layerArea("paved")===0?`<div class="check warn" style="margin-top:14px">
        <span class="mark">!</span><span class="txt"><strong>No paved area tagged</strong>
        <span>Roads are often drawn as open linework, which has no measurable area. Tag a layer as Paved, or enter the figure by hand on the next screen.</span></span></div>`:""}
    </div>
  </div>`
  + nav("Extract zones", S.nTanks>0 && !CAD.parsing);
}

/* ================= STAGE 1 — zones ================= */
function stage1(){
  const rows = S.zones.map(z=>{
    const p=potential(z);
    return `<tr>
      <td><input value="${esc(z.name)}" oninput="ez(${z.id},'name',this.value)"></td>
      <td class="in"><input type="number" value="${z.roof}" oninput="ez(${z.id},'roof',+this.value)"></td>
      <td class="in"><input type="number" value="${z.paved}" oninput="ez(${z.id},'paved',+this.value)"></td>
      <td class="in"><input type="number" value="${z.green}" oninput="ez(${z.id},'green',+this.value)"></td>
      <td class="r">${n(p.area)}</td>
      <td class="r">${n(p.total,2)}</td>
    </tr>`;}).join("");
  const tA=S.zones.reduce((a,z)=>a+potential(z).area,0);
  const tV=S.zones.reduce((a,z)=>a+potential(z).total,0);

  const nar=narrate();
  const chips=["Merge RWH-1 and RWH-2","Split RWH-2","Rebalance evenly",
    "The layout is duplicated — halve it","Move paved to RWH-1","Re-cluster"];

  return head()+`
  <div class="check ${S.approved?"ok":"warn"}">
    <span class="mark">${S.approved?"✓":"!"}</span>
    <span class="txt"><strong>${S.approved?"Zones approved":"Proposed zoning — not yet approved"}</strong>
    <span>${S.approved?"Sizing will use these figures."
      :(nar||"Boundaries are picked up by layer, so anything untagged in the client's drawing lands short. Check each figure against the plan before approving.")}</span></span></div>

  ${S.prov.length?`<div class="panel"><h3>How the zones were drawn
    <span class="sub">colour shows which boundaries went to which tank</span></h3>
    <div class="zonewrap">
      <div class="zonemap"><canvas id="zonecv"></canvas></div>
      <div class="zonekey">
        ${S.zones.map((z,i)=>{
          const p=S.prov[i]||{n:0,byLay:{}};
          const top=Object.entries(p.byLay).sort((a,b)=>b[1]-a[1]).slice(0,3);
          return `<div class="zk ${S.sel===i?"on":""} ${S.sel!==null&&S.sel!==i?"off":""}"
              onclick="S.sel=(S.sel===${i}?null:${i});render()">
            <span class="sw" style="background:${ZC[i%ZC.length]}"></span>
            <div><b>${esc(z.name)}</b>${z.edited?` <span class="badge">edited</span>`:""}
              <div class="meta">${n(p.n)} boundaries · ${n(potential(z).area)} sqm</div>
              ${top.map(([l,a])=>`<div class="meta">${esc(l.trim())} — ${n(a)} sqm</div>`).join("")}
            </div></div>`;}).join("")}
      </div>
    </div>
  </div>`:""}

  <div class="panel"><h3>Zone areas <span class="sub">yellow cells are editable</span></h3>
    <div class="tblwrap"><table>
      <thead><tr><th>Zone</th><th class="r">Rooftop (sqm)</th><th class="r">Paved (sqm)</th>
        <th class="r">Green (sqm)</th><th class="r">Total area</th><th class="r">Potential (cum)</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td>Total</td><td colspan="3"></td><td class="r">${n(tA)}</td><td class="r">${n(tV,2)}</td></tr></tfoot>
    </table></div>
  </div>

  <div class="panel"><h3>Change the zoning</h3><div class="body">
    <div class="promptbar">
      <input id="zprompt" placeholder="Tell it what to change — merge RWH-1 and RWH-2, split RWH-3, move paved to RWH-1…"
        onkeydown="if(event.key==='Enter')runPrompt()">
      <button class="btn" onclick="runPrompt()">Apply</button>
    </div>
    <div class="choices" style="margin-top:10px">
      ${chips.map(c=>`<button class="choice" onclick="document.getElementById('zprompt').value=${JSON.stringify(c).replace(/"/g,"&quot;")};runPrompt()">${esc(c)}</button>`).join("")}
    </div>
    ${S.log.length?`<div class="plog">${S.log.slice(0,6).map(l=>
      `<div class="pl ${l.ok?"":"bad"}"><span class="q">${esc(l.t)}</span><span class="a">${esc(l.m)}</span></div>`).join("")}</div>`:""}
  </div></div>

  <div class="actions">
    <button class="btn ghost" onclick="go(0)">Back</button>
    <div class="spacer"></div>
    ${S.approved
      ? `<button class="btn" onclick="go(2)">Continue to sizing</button>`
      : `<button class="btn" onclick="approve()">Approve areas</button>`}
  </div>`;
}

/* ================= STAGE 2 — volume + module sizing ================= */
function stage2(){
  const blocks = S.zones.map(z=>{
    const p=potential(z), t=tankOf(z), fit=(t.V-p.total);
    const row=(nm,a,c,v)=>`<tr><td>${nm}</td><td>Sqm</td><td class="r">${n(a)}</td>
      <td class="r">${c.toFixed(2)}</td><td class="r">${n(rainM(),3)}</td><td class="r">${n(v,2)}</td></tr>`;
    return `<div class="panel"><h3>${esc(z.name)}</h3>
      <div class="tblwrap"><table>
        <thead><tr><th>Particular</th><th>UOM</th><th class="r">Area</th><th class="r">Coefficient</th>
          <th class="r">Rainfall (m)</th><th class="r">Total (cum)</th></tr></thead>
        <tbody>
          ${row("Rooftop area",z.roof,COEF.roof,p.r)}
          ${row("Paved area",z.paved,COEF.paved,p.p)}
          ${row("Green area",z.green,COEF.green,p.g)}
        </tbody>
        <tfoot><tr><td colspan="2">Total</td><td class="r">${n(p.area)}</td><td colspan="2"></td><td class="r">${n(p.total,2)}</td></tr></tfoot>
      </table></div>
      <div class="body" style="border-top:1px solid var(--rule2)">
        <div class="grid4">
          <div class="f"><label>Module stack</label>
            <select onchange="ez(${z.id},'layers',+this.value); autoGrid(${z.id})">
              ${[3,4,5].map(k=>`<option value="${k}" ${z.layers===k?"selected":""}>${STACK[k]} — ${DEPTHS[k]} m</option>`).join("")}
            </select></div>
          <div class="f"><label>Modules along L</label><input type="number" value="${z.nl}" oninput="ez(${z.id},'nl',+this.value)"></div>
          <div class="f"><label>Modules along W</label><input type="number" value="${z.nw}" oninput="ez(${z.id},'nw',+this.value)"></div>
          <div class="f"><label>&nbsp;</label><button class="btn ghost small" onclick="autoGrid(${z.id})">Solve grid</button></div>
        </div>
        <div class="deriv"><div class="k">Tank size from module count</div>
          <div class="v">L ${z.nl} × ${PL} = ${n(t.L,3)} m &nbsp; W ${z.nw} × ${PW} = ${n(t.W,3)} m &nbsp; H ${n(t.H,2)} m
            → <em>${n(t.V,2)} cum</em> against ${n(p.total,2)} required (${fit>=0?"+":""}${n(fit,2)})<br>
            ${t.boxes} boxes → ${n(t.large)} large plates, ${n(t.small)} small plates</div></div>
      </div>
    </div>`;}).join("");

  const totV=S.zones.reduce((a,z)=>a+tankOf(z).V,0);
  const reqV=S.zones.reduce((a,z)=>a+potential(z).total,0);
  return head()+blocks+`
  <div class="panel"><h3>Sizing summary</h3>
    <div class="tblwrap"><table>
      <thead><tr><th>Tank</th><th class="r">Length (m)</th><th class="r">Width (m)</th>
        <th class="r">Height (m)</th><th class="r">Volume (cum)</th></tr></thead>
      <tbody>${S.zones.map(z=>{const t=tankOf(z);return `<tr><td>${esc(z.name)}</td>
        <td class="r">${n(t.L,3)}</td><td class="r">${n(t.W,2)}</td>
        <td class="r">${n(t.H,2)}</td><td class="r">${n(t.V,3)}</td></tr>`;}).join("")}</tbody>
      <tfoot><tr><td colspan="4">Total against ${n(reqV,2)} cum required</td><td class="r">${n(totV,3)}</td></tr></tfoot>
    </table></div>
  </div>`+nav();
}

/* ================= STAGE 3 — per-tank calculations ================= */
function stage3(){
  const T=allCalc();
  const blocks=S.zones.map((z,i)=>{
    const t=T[i];
    const line=(a,b,c,d)=>`<tr><td>${a}</td><td>${b}</td><td class="r">${c}</td>${d?`<td class="note" style="font-size:11.5px">${d}</td>`:"<td></td>"}</tr>`;
    return `<div class="panel"><h3>${esc(z.name)}</h3><div class="body">
      <div class="grid4">
        <div class="f"><label>Length (m)</label><input type="number" step="0.001" value="${t.L}" oninput="ez(${z.id},'fixL',+this.value)"></div>
        <div class="f"><label>Width (m)</label><input type="number" step="0.01" value="${t.W}" oninput="ez(${z.id},'fixW',+this.value)"></div>
        <div class="f"><label>Height (m)</label><input type="number" step="0.01" value="${t.H}" readonly style="background:var(--band)"></div>
        <div class="f"><label>Invert level (m)</label><input type="number" step="0.1" value="${z.invert}" oninput="ez(${z.id},'invert',+this.value)"></div>
      </div>
      <div class="grid4" style="margin-top:12px">
        <div class="f"><label>Number of borewells</label><input type="number" value="${z.bores}" oninput="ez(${z.id},'bores',+this.value)"></div>
        <div class="f"><label>Depth of borewell (m)</label><input type="number" value="${z.bdepth}" oninput="ez(${z.id},'bdepth',+this.value)"></div>
      </div>
    </div>
    <div class="tblwrap"><table>
      <thead><tr><th style="width:40%">Item</th><th>Unit</th><th class="r">Quantity</th><th>Formula</th></tr></thead>
      <tbody>
        ${line("Module volume","Cum",n(t.vol,3),"L × W × H")}
        ${line("Geotextile","Sqm",n(t.geo,3),"(2LW + 2WH + 2HL) × 1.3")}
        ${line("Geotextile for base","Sqm",n(t.geoBase,3),"(L+1)(W+1) × 1.1")}
        ${line("Total depth","m",n(t.D,2),`invert + 0.20 + ${COVER} + H + 0.20`)}
        ${line("Excavation and disposal","Cum",n(t.exc,3),"mean of (L+2)(W+2)D and (L+1)(W+1)D")}
        ${line("Aggregate 40 mm for base","Cum",n(t.agg,3),"(L+1)(W+1) × 0.1")}
        ${line("Sand for base and tank top","Cum",n(t.sand,3),"(L+1)(W+1) × 0.1 + LW × 0.2")}
        ${line("Backfilling","Cum",n(t.back,3),"excavation − volume − sand − aggregate")}
        ${line("Surface dressing","Sqm",n(t.dress,3),"(L+1)(W+1)")}
        ${line("Depth of borewell","m",n(t.boreTot,0),"bores × depth")}
        ${line("160 mm plain casing","m",n(t.plain,0),"40% of bore length")}
        ${line("160 mm slotted screen","m",n(t.slot,0),"60% of bore length")}
        ${line("Gravel in borewell","cft",n(t.gravel,3),"(πr²bore − πr²pipe) × depth × 35.314 × bores")}
        ${line("FRP inspection ports","Nos",n(t.ports,0),"⌈total depth ÷ 1.5⌉")}
      </tbody>
    </table></div></div>`;}).join("");

  return head()+`
  <div class="check warn"><span class="mark">!</span><span class="txt">
    <strong>${COVER} m cover carried from your standard</strong>
    <span>Total depth is invert + 0.20 + ${COVER} + H + 0.20, the same stack used in the module calculation sheet.</span></span></div>
  <div style="display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start">
    <div>${blocks}</div>
    <div class="panel" style="position:sticky;top:18px">
      <h3>Section — ${esc(T[0].name)}</h3>
      <div class="body draw">${section(T[0])}</div>
      <div class="legend">Depth stack as built by the formula above.</div>
    </div>
  </div>`+nav();
}

/* ================= STAGE 4 — total calculation ================= */
function stage4(){
  const T=allCalc();
  const cols=[["Length (m)","L",3],["Width (m)","W",2],["Height (m)","H",2],
    ["Supply Rainmaxx (cum)","vol",2],["Installation (cum)","vol",2],
    ["Geotextile (sqm)","geo",2],["Geotex base (sqm)","geoBase",2],
    ["Micro filter","micro",0],["Horiz. filter","horiz",0],
    ["Borewell (no.)","bores",0],["Depth of borewell","boreTot",0],["Depth of pipe","pipeTot",0],
    ["160 screen (m)","slot",0],["160 pipe (m)","plain",0],["Gravel (cft)","gravel",2],
    ["Excavation (cum)","exc",2],["Aggregate (cum)","agg",2],["Sand (cum)","sand",2],
    ["Backfilling (cum)","back",2],["Invert level","invert",2],["Total depth","D",2],
    ["Surface dressing","dress",2],["FRP inspection","ports",0]];
  return head()+`
  <div class="panel"><h3>Total calculation <span class="sub">column order as the BOQ reads it</span></h3>
    <div class="tblwrap"><table class="wide">
      <thead><tr><th>Pit</th>${cols.map(c=>`<th class="r">${c[0]}</th>`).join("")}</tr></thead>
      <tbody>${T.map((t,i)=>`<tr><td>Pit ${i+1}</td>${cols.map(c=>`<td class="r">${n(t[c[1]],c[2])}</td>`).join("")}</tr>`).join("")}</tbody>
      <tfoot><tr><td>Total</td>${cols.map(c=>{
        const skip=["L","W","H","invert","D"].includes(c[1]);
        return `<td class="r">${skip?"—":n(T.reduce((a,t)=>a+t[c[1]],0),c[2])}</td>`;}).join("")}</tr></tfoot>
    </table></div>
  </div>
  <p class="note" style="margin-top:12px">Totals from this row feed the quantity column of the bill. Dimensions are not summed.</p>`+nav();
}

/* ================= STAGE 5 — chambers ================= */
function stage5(){
  const s=summary();
  const f=(o,k,l,st)=>`<div class="f"><label>${l}</label><input type="number" step="${st||0.05}" value="${o[k]}" oninput="setC('${o===S.dc?"dc":"fc"}','${k}',+this.value)"></div>`;
  return head()+`
  <div class="grid2">
    <div class="panel"><h3>Desilting chamber</h3><div class="body">
      <div class="grid3">${f(S.dc,"L","Effective length (m)")}${f(S.dc,"W","Effective width (m)")}${f(S.dc,"D","Depth (m)")}</div>
      <div class="grid3" style="margin-top:12px">${f(S.dc,"wall","Wall thickness (m)")}${f(S.dc,"pcc","PCC thickness (m)")}${f(S.dc,"slab","RCC slab (m)")}</div>
    </div></div>
    <div class="panel"><h3>Filter chamber</h3><div class="body">
      <div class="grid3">${f(S.fc,"L","Effective length (m)")}${f(S.fc,"W","Effective width (m)")}${f(S.fc,"D","Depth (m)")}</div>
      <div class="grid3" style="margin-top:12px">${f(S.fc,"wall","Wall thickness (m)")}${f(S.fc,"pcc","PCC thickness (m)")}</div>
    </div></div>
  </div>
  <div class="panel"><h3>Summary of item</h3>
    <div class="tblwrap"><table>
      <thead><tr><th>SN</th><th>Description of item</th><th class="r">Desilting-1</th>
        <th class="r">Filter ch.-1</th><th>Unit</th><th class="r">Total</th></tr></thead>
      <tbody>${s.map((r,i)=>`<tr><td>${i+1}</td><td>${r.n}</td>
        <td class="r">${n(r.d,3)}</td><td class="r">${r.f?n(r.f,3):"—"}</td>
        <td>${r.u}</td><td class="r">${n(r.t,3)}</td></tr>`).join("")}</tbody>
    </table></div>
  </div>
  <div class="check ok" style="margin-top:16px"><span class="mark">✓</span><span class="txt">
    <strong>Steel bar references corrected</strong>
    <span>The template cross-references the 10 mm and 8 mm bar dimensions (M8 reads L9, M9 reads L8). Both now read their own chamber dimensions, at 0.617 and 0.398 kg/m.</span></span></div>`+nav("Generate BOQ");
}

        <tr><td colspan="5">Total number of RWH pits proposed</td><td class="r">${S.zones.length} Nos</td></tr>
        <tr><td colspan="5">IGST at 18%</td><td class="r">${inr(b.gst)}</td></tr>

  <div class="panel"><h3>Outputs</h3><div class="body">

      <li><span class="ext">XLSX</span><span>RWH calculation sheet<span class="sub"> — zone areas, coefficients and rainfall as sent to the client</span></span></li>

      <li><span class="ext">PDF</span><span>Technical proposal<span class="sub"> — data sheets, methodology, compliance note</span></span></li>
    </ul>
    <div class="actions" style="margin-top:6px">
      <button class="btn" onclick="exportBOQ()">Download BOQ workbook</button>
      <button class="btn ghost" onclick="reset()">Start another project</button>

  </div></div>`;
}

/* ================= XLSX EXPORT ================= */
function exportBOQ(){
  if(typeof XLSX==="undefined"){ alert("Spreadsheet library still loading — try again in a moment."); return; }
  const wb=XLSX.utils.book_new(), T=allCalc(), s=summary(), b=boq();
  const add=(rows,name)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),name.slice(0,31));

  /* --- RWH calculation sheet, Bareilly layout --- */
  const cs=[[`RWH CALCULATION SHEET — ${S.project.name}`],[`${S.project.client}, ${S.project.city}`],[]];
  S.zones.forEach(z=>{
    const p=potential(z);
    cs.push([`CALCULATION FOR ${z.name}`]);
    cs.push(["Sr.no.","PARTICULAR","UOM","Area (sqm)","Co-efficient","Rainfall m/day","Total(cum)"]);
    cs.push([1,"Rooftop Area","Sqm",z.roof,COEF.roof,rainM(),p.r]);
    cs.push([2,"Paved Area","Sqm",z.paved,COEF.paved,rainM(),p.p]);
    cs.push([3,"Green","Sqm",z.green,COEF.green,rainM(),p.g]);
    cs.push(["","Total","Sqm",p.area,"","",p.total]);
    cs.push([]);
  });
  cs.push(["","Tank","Length (m)","Width (m)","Height (m)","Volume (cum)","Modules L","Modules W","Boxes"]);
  S.zones.forEach(z=>{const t=tankOf(z);cs.push(["",z.name,t.L,t.W,t.H,t.V,z.nl,z.nw,t.boxes]);});
  cs.push(["","Total","","","",S.zones.reduce((a,z)=>a+tankOf(z).V,0)]);
  add(cs,"RWH CALCULATION");

  /* --- one sheet per tank --- */
  T.forEach((t,i)=>{
    add([
      [`${t.name} CALCULATIONS`],[],
      ["Length (m)",t.L],["Width (m)",t.W],["Height (m)",t.H],["Volume (cum)",t.vol],[],
      ["Item","Unit","Quantity","Formula"],
      ["Supply of Rainmaxx Smart","Cum",t.vol,"L × W × H"],
      ["Installation of Rainmaxx Smart","Cum",t.vol,"= volume"],
      ["Supply of Geotextile","Sqm",t.geo,"(2LW+2WH+2HL) × 1.3"],
      ["Geotextile for base","Sqm",t.geoBase,"(L+1)(W+1) × 1.1"],
      ["Micro filter","Nos",t.micro,""],
      ["Horizontal filter","Nos",t.horiz,""],
      ["Bore well","Nos",t.bores,"user input"],
      ["Depth of borewell","m",t.boreTot,"bores × depth"],
      ["Depth of pipe","m",t.pipeTot,""],
      ["160 mm dia screen","m",t.slot,"60% of bore length"],
      ["160 mm dia pipe","m",t.plain,"40% of bore length"],
      ["Gravel in borewell","cft",t.gravel,"(πr²b − πr²p) × depth × 35.314 × bores"],
      ["Excavation & disposal","Cum",t.exc,"mean of (L+2)(W+2)D and (L+1)(W+1)D"],
      ["Aggregate 40mm for base","Cum",t.agg,"(L+1)(W+1) × 0.1"],
      ["Sand for base + tank top","Cum",t.sand,"(L+1)(W+1)×0.1 + LW×0.2"],
      ["Backfilling","Cum",t.back,"excavation − volume − sand − aggregate"],
      ["Invert level","m",t.invert,"user input"],
      ["Total depth","m",t.D,`invert + 0.20 + ${COVER} + H + 0.20`],
      ["Surface dressing","Sqm",t.dress,"(L+1)(W+1)"],
      ["FRP inspection","Nos",t.ports,"⌈total depth ÷ 1.5⌉"]
    ], `${t.name} CALCULATIONS`);
  });

  /* --- Total Calculation --- */
  const cols=[["Length\n(m)","L"],["Width\n(m)","W"],["Height (m)","H"],
    ["Supply of Rainmaxx Smart Volume (cum)","vol"],["Installation of Rainmaxx Smart (cum)","vol"],
    ["Supply of Geotextile (sqmt)","geo"],["Supply of Geotextile for base(sqmt)","geoBase"],
    ["Micro filter","micro"],["Horizontal filter","horiz"],["Bore well (no.)","bores"],
    ["Depth of Borewell","boreTot"],["Depth of Pipe","pipeTot"],
    ["160 mm dia pipe Screen (Meter)","slot"],["160 mm dia pipe (Meter)","plain"],
    ["Gravel in borewell (cft)","gravel"],["Excavation & Disposal (cum)","exc"],
    ["Aggregate 40mm for Base (cum)","agg"],["Sand for Base + Tank SIDES (cum)","sand"],
    ["Compaction of base","one"],["Backfilling (cum)","back"],["Invert level (meter)","invert"],
    ["Total depth","D"],["Surface dressing","dress"],["FRP Inspection","ports"]];
  const tc=[["BOQ"],["Pit No.",...cols.map(c=>c[0])]];
  T.forEach((t,i)=>tc.push([`Pit ${i+1}`,...cols.map(c=>c[1]==="one"?1:t[c[1]])]));
  tc.push(["Total",...cols.map(c=>
    ["L","W","H","invert","D"].includes(c[1])?"":
    (c[1]==="one"?T.length:T.reduce((a,t)=>a+t[c[1]],0)))]);
  add(tc,"Total Calculation");

  /* --- chambers --- */
  const ch=(c,nm,rcc)=>{const q=chamber(c,rcc);return [
    [nm],[],["Effective length (m)",c.L],["Effective width (m)",c.W],["Depth (m)",c.D],
    ["Wall thickness (m)",c.wall],["PCC thickness (m)",c.pcc],...(rcc?[["RCC slab (m)",c.slab]]:[]),[],
    ["Item","Unit","Quantity"],
    ["Excavation","Cum",q.exc],["PCC","Cum",q.pcc],["Brick work","Cum",q.brick],
    ["Plaster","Sqm",q.plaster],["RCC","Cum",q.rcc],["Steel","kg",q.steel],["Shuttering","Sqm",q.shut]];};
  add(ch(S.dc,"DESILTING CHAMBER",true),"Desilting");
  add(ch(S.fc,"FILTER CHAMBER",false),"Filter Chamber");

  add([["SUMMARY OF ITEM"],["SN","DISCREPTION OF ITEM","DISELTIMG-1","FILTER CH.-1","UNIT","TOTAL"],
    ...s.map((r,i)=>[i+1,r.n,r.d,r.f||"",r.u,r.t])],"SUMMARY");

  /* --- BOQ, template layout --- */
  const bq=[["BILL OF QUANTITY - RECHARGE TANK WITH BRICK MASONRY DESILTING CHAMBER"],[],
    ["Sl. No","Description of Item","Quantity","Unit","Rate","Amount"]];
  b.rows.forEach(g=>bq.push(g.h?[g.h,g.d]:[g.s,g.d,g.q,g.u,g.r,g.a]));
  bq.push(["","Total","","","",b.sub]);
  bq.push(["","Total no. of RWH pit proposed","Nos",S.zones.length]);
  bq.push(["","IGST @ 18 % Applicable","","","",b.gst]);
  bq.push(["","Grand Total","","","",b.tot]);
  bq.push([]);
  bq.push(["Note: Total sums every priced section. The source template summed section 6 only."]);
  bq.push([`Rate schedule: ${S.region}. Rates indicative.`]);
  add(bq,"RECHARGE WITH BRICKWORK");

  const safe=(S.project.name||"project").replace(/[^A-Za-z0-9]+/g,"_").slice(0,40);
  XLSX.writeFile(wb,`FRESH_BOQ_${safe}.xlsx`);
}

/* ================= EVENTS ================= */
function set(path,val){const p=path.split(".");let o=S;while(p.length>1)o=o[p.shift()];o[p[0]]=val;
  const k=document.activeElement&&document.activeElement.id;render(k);}
function ez(id,k,v){
  const z=S.zones.find(x=>x.id===id); if(!z) return;
  if(k==="fixL"){ z.nl=Math.max(1,Math.round(v/PL)); }
  else if(k==="fixW"){ z.nw=Math.max(1,Math.round(v/PW)); }
  else z[k]=v;
  if(["roof","paved","green"].includes(k)) S.approved=false;
  render();
}
function autoGrid(id){
  const z=S.zones.find(x=>x.id===id); if(!z) return;
  const g=solveGrid(potential(z).total, z.layers); z.nl=g.nl; z.nw=g.nw; render();
}
function setC(which,k,v){ S[which][k]=v; render(); }
function setTanks(v){
  v=Math.max(1,Math.min(12,v||1)); S.nTanks=v; S.approved=false;
  const out=[];
  if(CAD.loaded){
    // split the tagged catchment evenly; the engineer redistributes on the next screen
    const R=layerArea("roof")/v, P=layerArea("paved")/v, G=layerArea("green")/v;
    for(let i=0;i<v;i++) out.push({id:i+1,name:`RWH-${i+1}`,roof:Math.round(R),
      paved:Math.round(P),green:Math.round(G),layers:4,nl:0,nw:0,bores:3,bdepth:30,invert:1.0});
  } else {
    const base=[[5755,15395,1035],[15958,8424,5112],[13083,13569,4445]];
    for(let i=0;i<v;i++){
      const ex=S.zones[i], b=base[i%3], sc=1-(Math.floor(i/3)*0.18);
      out.push(ex||{id:i+1,name:`RWH-${i+1}`,roof:Math.round(b[0]*sc),paved:Math.round(b[1]*sc),
        green:Math.round(b[2]*sc),layers:4,nl:0,nw:0,bores:3,bdepth:30,invert:1.0});
    }
  }
  S.zones=out.slice(0,v);
  S.zones.forEach(z=>{ if(!z.nl){const g=solveGrid(potential(z).total,z.layers);z.nl=g.nl;z.nw=g.nw;} });
  render("nt");
}
function reseed(){ const v=S.nTanks; S.zones=[]; setTanks(v); }
function approve(){ S.approved=true; S.zones.forEach(z=>{const g=solveGrid(potential(z).total,z.layers);z.nl=g.nl;z.nw=g.nw;}); go(2); }
function reset(){ S.step=0; S.seen=0; S.approved=false; render(); }
function go(i){
  if(i>S.seen+1) return;
  if(S.step===0 && i===1 && CAD.loaded && !S.approved){ S.log=[]; buildZones(); }
  S.step=i; S.seen=Math.max(S.seen,i); render(); window.scrollTo({top:0,behavior:"instant"});
}
function render(focusId){
  S.seen=Math.max(S.seen,S.step); drawRail();
  $("#stage").innerHTML=[stage0,stage1,stage2,stage3,stage4,stage5,stage6][S.step]();
  if(S.step===0) bindCAD();
  if(S.step===1 && S.prov.length) requestAnimationFrame(drawZones);
  if(focusId){const el=document.getElementById(focusId);
    if(el){el.focus();if(el.setSelectionRange&&el.type!=="number"){const v=el.value;el.setSelectionRange(v.length,v.length);}}}
}
window.addEventListener("resize",()=>{ if(S.step===0&&CAD.loaded) drawCAD(); });
render();
</script>
</body>
</html>
